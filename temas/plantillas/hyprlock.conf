# Generado por dots-aplicar-tema ({{NOMBRE}}). No editar: se sobrescribe al cambiar de tema.
# Para cambiar el diseño edita temas/plantillas/hyprlock.conf en el repo.
# hyprlock sigue usando el formato hyprlang; no forma parte de la migración a Lua.

$font = JetBrainsMono Nerd Font

general {
  hide_cursor = true
}

# FONDO
background {
  monitor =
  path = {{RUTA_FONDO_PANTALLA}}
  blur_passes = 2
  color = rgb({{BLOQUEO_FONDO_HEX}})
}

# HORA
label {
  monitor =
  text = $TIME
  color = rgb({{TEXTO_HEX}})
  font_size = 90
  font_family = $font
  position = 0, 150
  halign = center
  valign = center
}

# FECHA
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = rgb({{TEXTO_HEX}})
  font_size = 25
  font_family = $font
  position = 0, 50
  halign = center
  valign = center
}

# CAMPO DE CONTRASEÑA
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = rgb({{ACENTO_HEX}})
  inner_color = rgb({{BLOQUEO_FONDO_HEX}})
  font_color = rgb({{BLOQUEO_TEXTO_ENTRADA_HEX}})
  fade_on_empty = false
  placeholder_text =
  hide_input = false
  check_color = rgb({{ACENTO_HEX}})
  fail_color = rgb({{URGENTE_HEX}})
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = rgb(f9e2af)
  position = 0, -47
  halign = center
  valign = center
}
