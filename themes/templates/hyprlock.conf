# Generated by dots-apply-theme ({{NAME}}). Do not edit: it is overwritten when the theme changes.
# To change the layout, edit themes/templates/hyprlock.conf in the repo.
# hyprlock still uses the hyprlang format; it is not part of the Lua migration.

$font = JetBrainsMono Nerd Font

general {
  hide_cursor = true
}

# BACKGROUND
background {
  monitor =
  path = {{WALLPAPER_PATH}}
  blur_passes = 2
  color = rgb({{LOCK_BG_HEX}})
}

# TIME
label {
  monitor =
  text = $TIME
  color = rgb({{TEXT_HEX}})
  font_size = 90
  font_family = $font
  position = 0, 150
  halign = center
  valign = center
}

# DATE (follows the system locale)
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = rgb({{TEXT_HEX}})
  font_size = 25
  font_family = $font
  position = 0, 50
  halign = center
  valign = center
}

# PASSWORD FIELD
input-field {
  monitor =
  size = 300, 60
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = rgb({{ACCENT_HEX}})
  inner_color = rgb({{LOCK_BG_HEX}})
  font_color = rgb({{LOCK_INPUT_TEXT_HEX}})
  fade_on_empty = false
  placeholder_text =
  hide_input = false
  check_color = rgb({{ACCENT_HEX}})
  fail_color = rgb({{URGENT_HEX}})
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = rgb(f9e2af)
  position = 0, -47
  halign = center
  valign = center
}
